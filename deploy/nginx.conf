server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Загрузка обрезанного аудио может быть крупной
    client_max_body_size 512m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # SharedArrayBuffer нужен только если подключаете ffmpeg.wasm (multi-thread).
    # Заголовки безопасны и для основного пути (Web Audio API).
    add_header Cross-Origin-Opener-Policy   same-origin   always;
    add_header Cross-Origin-Embedder-Policy require-corp  always;
    add_header X-Content-Type-Options       nosniff       always;
    add_header Referrer-Policy              no-referrer   always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Прокси на backend, чтобы фронт ходил на тот же origin (без CORS)
    location /api/ {
        proxy_pass         http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}
