# Продакшн-оверрайд для VPS: Caddy с TLS вместо публикации портов наружу,
# oauth2-proxy перед /workflows (n8n) и /admin.
# docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Тот же файл годится для локальной проверки входа (см. docs/07-vps-deploy.md):
#   SITE_ADDRESS=:80  CADDY_HTTP_PORT=8081  PUBLIC_BASE_URL=http://localhost:8081
#   OAUTH2_PROXY_COOKIE_SECURE=false
services:
  caddy:
    image: caddy:2-alpine
    container_name: tr-caddy
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-transcriber.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend:/srv/frontend:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api, n8n, oauth2-proxy]

  # --------------------------------------------------------------------------
  # Вход через OAuth-провайдера. Работает как auth-сервис для Caddy (forward_auth),
  # проксировать трафик сам не должен — upstream-заглушка
  # --------------------------------------------------------------------------
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
    container_name: tr-oauth2-proxy
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_PROVIDER: ${OAUTH2_PROXY_PROVIDER:-google}
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH2_PROXY_CLIENT_ID:?set OAUTH2_PROXY_CLIENT_ID in .env}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH2_PROXY_CLIENT_SECRET:?set OAUTH2_PROXY_CLIENT_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:?set OAUTH2_PROXY_COOKIE_SECRET in .env}
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
      # Callback, который нужно прописать в консоли провайдера
      OAUTH2_PROXY_REDIRECT_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}/oauth2/callback
      OAUTH2_PROXY_AUTHENTICATED_EMAILS_FILE: /etc/oauth2-proxy/emails.txt
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
    volumes:
      - ${OAUTH2_PROXY_EMAILS_FILE:-./deploy/oauth2-proxy/emails.txt}:/etc/oauth2-proxy/emails.txt:ro
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # n8n живёт под /workflows/ на основном домене (редактор — за oauth2-proxy);
  # отдельный поддомен n8n.* больше не нужен
  n8n:
    environment:
      N8N_PATH: /workflows/
      N8N_EDITOR_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}/workflows/
      # Вебхуки остаются в корне: https://домен/webhook/…
      WEBHOOK_URL: ${PUBLIC_BASE_URL:-http://localhost:8081}/
      N8N_PROXY_HOPS: "1"
    ports: !override []

  # Внутренние сервисы больше не торчат на 0.0.0.0
  frontend:
    profiles: ["disabled"]
  api:
    ports: !override []
  asr:
    ports: !override []
  ollama:
    ports: !override []

volumes:
  caddy-data:
  caddy-config:
