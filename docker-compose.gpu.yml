# Оверрайд для машины с NVIDIA GPU (нужен nvidia-container-toolkit).
# docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
services:
  asr:
    image: ghcr.io/speaches-ai/speaches:latest-cuda
    environment:
      WHISPER__COMPUTE_TYPE: float16
      WHISPER__INFERENCE_DEVICE: cuda
      WHISPER__MODEL: ${WHISPER__MODEL:-deepdml/faster-whisper-large-v3-turbo-ct2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
